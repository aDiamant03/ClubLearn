name: Java CD with Gradle

on:
  push:
    # Запускается только при пуше или мердже в main
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Собираем проект, пропуская тесты (так как в GitHub нет вашей БД)
        run: ./gradlew build -x test

      # Сборка Docker-образа
      - name: Build Docker Image
        run: docker build -t ${{ bat1354 }}/clublearn:latest .

      # Авторизация в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ bat1354 }}
          password: ${{ Let's_L1nk_Up_and_D1e! }}

      # Пуш образа в Docker Hub
      - name: Push Docker Image
        run: docker push ${{ bat1354 }}/clublearn:latest