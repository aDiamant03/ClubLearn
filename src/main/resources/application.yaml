spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: user
    password: pass
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true